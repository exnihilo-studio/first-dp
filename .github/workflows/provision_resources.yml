name: provision_resources.yml
on:
  workflow_dispatch:

  push:
    branches:
      - '**'

permissions:
  id-token: write
  contents: write
  packages: read
  pull-requests: read

env:
  GENESIS_ACTION_VERSION: v0.17.0-feat-automatic-environment-detection.1
  GENESIS_VERSION: v0.18.0
  BUILD_DOCKER_IMAGE: false

jobs:

  build-docker-image:
    name: "Build and publish Docker image"
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
    outputs:
      image: ${{ steps.build.outputs.image }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout genesis-action
        uses: actions/checkout@v7.0.1
        with:
          repository: aalloul/genesis-action
          ref: ${{ env.GENESIS_ACTION_VERSION }}
          path: .genesis-action

      - id: auth
        if: ${{ env.BUILD_DOCKER_IMAGE == 'true' }}
        uses: ./.genesis-action/authenticate-with-gcp
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER_NAME }}
          gcp_project: ${{ vars.PROJECT_ID }}
          service_account: ${{ vars.DEPLOYMENT_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token

      - id: release
        if: ${{ env.BUILD_DOCKER_IMAGE == 'true' }}
        uses: ./.genesis-action/semantic-release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        if: ${{ steps.release.outputs.released == 'true' }}
        uses: ./.genesis-action/build-and-push-docker-image
        with:
          repository_url: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY_URL }}
          version: ${{ steps.release.outputs.version }}
          registry_password: ${{ steps.auth.outputs.access_token }}

      - name: Show image
        if: ${{ steps.build.outputs.image != '' }}
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Image: ${IMAGE%:*}"
          echo "Tag:   ${VERSION}"
          echo "Full:  ${IMAGE}"
          {
            echo "### Docker image pushed"
            echo "- Image: \`${IMAGE%:*}\`"
            echo "- Tag: \`${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  provision-resources:
    name: "Provision resources"
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
    needs: build-docker-image

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout genesis-action
        uses: actions/checkout@v7.0.1
        with:
          repository: aalloul/genesis-action
          ref: ${{ env.GENESIS_ACTION_VERSION }}
          path: .genesis-action

      - uses: ./.genesis-action/authenticate-with-gcp
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER_NAME }}
          gcp_project: ${{ vars.PROJECT_ID }}

      - uses: ./.genesis-action/genesis-infra-api
        with:
          action: provision-resources
          config_yml_file: data_product_definition.yml
          genesis_version: ${{ env.GENESIS_VERSION }}
          debug: true
          run_terraform_apply: true
          env_vars: ${{ toJSON(vars) }}
          secrets: ${{ toJSON(secrets) }}
