name: "first data product"
short_name: "first-dp"
description: "This is the first data product"
github_maintainer_team_slug: "exnihilo-team"
github_repo_visibility: "public"
team_google_group: "data_team@adamdataservices.com"

gcp:
  buckets:
    - name: "test-bucket"
      force_destroy: true
      versioning: false

  bigquery:
    tables:
      - table_id: "first_table"
        description: "testing table provisioning"
        table_schema:
          - name: "id"
            type: "STRING"
            mode: "REQUIRED"
          - name: "name"
            type: "STRING"
            mode: "NULLABLE"
          - name: "created_at"
            type: "TIMESTAMP"
            mode: "NULLABLE"

  secrets:
    - name: "first_secret"
      labels: # optional
        label_1: "123"

airflow:
  - name: "multiply_by_23"
    description: "DAG doing a multiplication"
    folder: "airflow/src"

  - name: "csv_to_gcs_to_bigquery"
    description: "DAG to move CSV data to GCS and then to BigQuery"
    file: "airflow/csv_to_gcs_to_bigquery.py"
